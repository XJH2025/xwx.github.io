<!DOCTYPE html>
<html>
<head>
    <title>语音识别 - 网络错误修复版</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 20px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button.recording { background: #ff4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .status { margin-top: 20px; padding: 15px; border-radius: 4px; background: #f5f5f5; }
        .error { background: #ffebee; color: #c62828; border-left: 4px solid #c62828; }
        .warning { background: #fff3e0; color: #ef6c00; border-left: 4px solid #ef6c00; }
        .success { background: #e8f5e8; color: #2e7d32; border-left: 4px solid #2e7d32; }
        .info { background: #e3f2fd; color: #1565c0; border-left: 4px solid #1565c0; }
        .debug-panel { margin-top: 20px; padding: 10px; background: #fafafa; border: 1px solid #ddd; font-size: 13px; }
        .debug-panel pre { background: #333; color: #0f0; padding: 10px; overflow: auto; max-height: 200px; }
    </style>
</head>
<body>
    <h1>🎤 语音识别系统</h1>
    
    <!-- 环境检测结果 -->
    <div id="envCheck" class="status info">正在检测环境...</div>
    
    <!-- 控制按钮 -->
    <button id="startBtn" onclick="startRecording()">开始语音输入</button>
    
    <!-- 状态显示 -->
    <div id="status" class="status"></div>
    
    <!-- 识别结果 -->
    <div id="result" style="margin-top: 20px;"></div>
    
    <!-- 调试面板 (可折叠) -->
    <details class="debug-panel">
        <summary>🔧 调试信息</summary>
        <pre id="debugLog">等待日志输出...</pre>
    </details>

    <script>
        let recognition = null;
        let isRecording = false;
        let debugLogs = [];
        
        // 调试日志函数
        function debug(...args) {
            const log = `[${new Date().toLocaleTimeString()}] ${args.join(' ')}`;
            debugLogs.push(log);
            document.getElementById('debugLog').textContent = debugLogs.join('\n');
            console.log(...args);
        }

        // 环境检测
        function checkEnvironment() {
            const envDiv = document.getElementById('envCheck');
            const protocol = window.location.protocol;
            const hostname = window.location.hostname;
            const isLocalhost = hostname === 'localhost' || hostname === '127.0.0.1';
            const isHttps = protocol === 'https:';
            const isFile = protocol === 'file:';
            
            let envStatus = '';
            let envClass = 'info';
            let canRun = true;
            
            if (isFile) {
                envStatus = '⚠️ 您正在使用 file:// 协议打开文件。语音识别API通常不支持file协议，请使用本地服务器或HTTPS。';
                envClass = 'error';
                canRun = false;
            } else if (!isHttps && !isLocalhost) {
                envStatus = '❌ 错误：页面不是HTTPS协议！语音识别API要求必须在HTTPS或localhost下运行。';
                envClass = 'error';
                canRun = false;
            } else {
                envStatus = `✅ 环境正常：协议 ${protocol}，主机 ${hostname}`;
                envClass = 'success';
            }
            
            envDiv.textContent = envStatus;
            envDiv.className = `status ${envClass}`;
            
            if (!canRun) {
                document.getElementById('startBtn').disabled = true;
            }
            
            return canRun;
        }

        // 检测网络连通性
        async function checkNetworkConnectivity() {
            debug('正在检测网络连通性...');
            
            try {
                // 尝试连接一个可靠的CDN来检测网络
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                
                const response = await fetch('https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js', {
                    method: 'HEAD',
                    mode: 'no-cors',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                debug('✅ 基础网络连接正常');
                return true;
            } catch (error) {
                debug('❌ 网络连接失败:', error.message);
                return false;
            }
        }

        // 初始化语音识别
        function initRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                debug('❌ 浏览器不支持语音识别');
                updateStatus('您的浏览器不支持语音识别功能', 'error');
                return null;
            }

            debug('✅ 浏览器支持语音识别');
            const recognition = new SpeechRecognition();
            
            // 基础配置
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            
            return recognition;
        }

        // 更新状态显示
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        // 重置按钮
        function resetButton() {
            isRecording = false;
            const btn = document.getElementById('startBtn');
            btn.textContent = '开始语音输入';
            btn.classList.remove('recording');
        }

        // 开始录音
        async function startRecording() {
            debug('开始启动语音识别...');
            
            // 检查环境
            if (!checkEnvironment()) {
                return;
            }

            // 检查网络
            const networkOk = await checkNetworkConnectivity();
            if (!networkOk) {
                updateStatus('网络连接失败，请检查网络设置后重试', 'error');
                return;
            }

            // 请求麦克风权限
            try {
                debug('请求麦克风权限...');
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                debug('✅ 麦克风权限已获取');
                
                // 关闭音轨，释放麦克风
                stream.getTracks().forEach(track => track.stop());
                
                // 继续语音识别
                startSpeechRecognition();
                
            } catch (err) {
                debug('❌ 麦克风权限被拒绝:', err.message);
                updateStatus('无法访问麦克风，请授予权限后重试', 'error');
            }
        }

        // 启动语音识别
        function startSpeechRecognition() {
            recognition = initRecognition();
            if (!recognition) return;

            // 设置事件监听
            recognition.onstart = () => {
                isRecording = true;
                const btn = document.getElementById('startBtn');
                btn.textContent = '正在聆听...';
                btn.classList.add('recording');
                updateStatus('🎤 请开始说话...', 'info');
                debug('语音识别已启动');
            };

            // 🎯 关键：处理 network 错误
            recognition.onerror = (event) => {
                debug('语音识别错误:', event.error);
                console.log('完整错误对象:', event);
                
                if (event.error === 'network') {
                    // 网络错误详细诊断
                    const protocol = window.location.protocol;
                    const hostname = window.location.hostname;
                    
                    let errorMessage = '❌ 网络错误：无法连接到语音识别服务\n\n';
                    errorMessage += '可能的原因：\n';
                    
                    if (protocol !== 'https:' && hostname !== 'localhost') {
                        errorMessage += '1. 页面不是HTTPS协议（必须使用HTTPS或localhost）\n';
                    }
                    
                    errorMessage += '2. 防火墙或代理阻止了连接\n';
                    errorMessage += '3. 无法访问谷歌语音识别服务器\n';
                    errorMessage += '4. 网络连接不稳定\n\n';
                    errorMessage += '💡 建议解决方案：\n';
                    errorMessage += '• 使用 localhost 或部署到 HTTPS 服务器\n';
                    errorMessage += '• 检查网络连接和防火墙设置\n';
                    errorMessage += '• 尝试使用代理或VPN\n';
                    errorMessage += '• 稍后重试';
                    
                    updateStatus(errorMessage, 'error');
                    
                    // 尝试备用方案
                    suggestAlternative();
                }
                else if (event.error === 'no-speech') {
                    updateStatus('没有检测到语音，请检查麦克风并重试', 'warning');
                }
                else if (event.error === 'not-allowed') {
                    updateStatus('麦克风权限被拒绝', 'error');
                }
                else {
                    updateStatus(`错误: ${event.error}`, 'error');
                }
                
                resetButton();
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                const confidence = event.results[0][0].confidence;
                
                debug(`识别成功: "${transcript}" (置信度: ${confidence})`);
                
                document.getElementById('result').innerHTML = `
                    <div class="status success">
                        <strong>识别结果:</strong> "${transcript}"<br>
                        <small>置信度: ${Math.round(confidence * 100)}%</small>
                    </div>
                `;
                
                updateStatus('✅ 识别完成', 'success');
                recognition.stop();
            };

            recognition.onend = () => {
                debug('语音识别结束');
                resetButton();
            };

            // 尝试启动
            try {
                debug('正在启动语音识别...');
                recognition.start();
            } catch (error) {
                debug('启动失败:', error.message);
                updateStatus('启动失败: ' + error.message, 'error');
                resetButton();
            }
        }

        // 建议备用方案
        function suggestAlternative() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <div class="status warning">
                    <strong>🔊 无法使用语音识别？试试这些替代方案：</strong><br><br>
                    1. 使用 <strong>localhost</strong> 或部署到 HTTPS 服务器<br>
                    2. 使用其他语音识别服务（如 百度、讯飞）<br>
                    3. 在 Chrome 浏览器中访问 <a href="chrome://flags/#unsafely-treat-insecure-origin-as-secure" target="_blank">chrome://flags</a> 临时允许HTTP（不推荐）<br>
                    4. 使用文本输入作为备选
                </div>
            `;
        }

        // 页面加载时执行
        window.onload = () => {
            checkEnvironment();
            debug('页面加载完成，协议:', window.location.protocol);
            debug('主机名:', window.location.hostname);
            
            // 检查是否支持
            const supported = 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window;
            if (supported) {
                updateStatus('✅ 语音识别已就绪，点击按钮开始', 'success');
            } else {
                updateStatus('❌ 您的浏览器不支持语音识别', 'error');
                document.getElementById('startBtn').disabled = true;
            }
        };
    </script>
</body>
</html>
