<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title></title>
		<link rel="stylesheet" type="text/css" href="css/init.css">
		<link rel="stylesheet" type="text/css" href="css/index.css">
		<style>
			/* 核心：全屏遮罩样式 */
			.overlay {
			  /* 固定定位，不随滚动移动 */
			  position: fixed;
			  top: 0;
			  left: 0;
			  /* 铺满全屏 */
			  width: 100vw;
			  height: 100vh;
			  /* 半透明黑色背景（可修改透明度/颜色） */
			  background: rgba(0, 0, 0, 0.7);
			  /* 置于最顶层 */
			  z-index: 9999;
			  /* 默认隐藏 */
			  display: none;
			  /* 居中内部内容 */
			  justify-content: center;
			  align-items: center;
			}
			
			/* 遮罩显示时的类 */
			.overlay.show {
			  display: flex;
			}
			
			/* 遮罩内的内容框（可自定义） */
			.overlay-content {
			  background: white;
			  padding: 40px;
			  border-radius: 8px;
			  text-align: center;
			}

		</style>
	<script type="text/javascript" src="js/jquery-4.0.0.js"></script>
	</head>
	<body style="background-color: #ccc;">
		
		<div id="img" style="background: url('img/1.jpg'); background-repeat: no-repeat;background-size: cover;"></div>
		
		<div id="score">
			<img id="s1" src="img/mf.png" />
			<img id="s2" src="img/mf.png" />
			<img id="s3" src="img/mf.png" />
			<img id="s4" src="img/mf.png" />
			<img id="s5" src="img/mf.png" />
			<img id="s6" src="img/mf.png" />
			<img id="s7" src="img/mf.png" />
			<img id="s8" src="img/mf.png" />
			<img id="s9" src="img/mf.png" />
			<img id="s10" src="img/mf.png" />
		</div>
		<div style="clear: both;"></div>
		<div id="topic">
			<label id="lbl">1、这是什么花？</label>
		</div>
		
		<div id="key">
			<label id="A" class="key" onclick="sel('A')">木绵花</label>
			<label id="B" class="key" onclick="sel('B')">木绵花</label>
			<label id="C" class="key" onclick="sel('C')">木绵花</label>
			<label id="D" class="key" onclick="sel('D')">木绵花</label>
		</div>
	
	<!--------------------------遮罩----------------------------!-->	
							<div class="overlay" id="overlay" onclick="hideOverlay()">
							  <div class="overlay-content">
								<h1 style="font-size: 40px; font-weight: bold;">恭喜您获得</h1>
								<p id="ms" style="font-size: 40px; font-weight: bold; color: #c3bc4c;"></p>
								 <img src="img/m.png" style="width: 200px;" />
							  </div>
							</div>
							
						 
	<!--------------------------遮罩-end---------------------------!-->				
	
	
	
	</body>
	
</html>
<script type="text/javascript">
	var curr=0;
	var score=0;
	var item=[
				["1、这是什么花","1木绵花","1菊花","1百合花","1梅花","1木绵花"],
				["2、这是什么花","2木绵花","2菊花","2百合花","2梅花","2木绵花"],
				["3、这是什么花","1木绵花","1菊花","1百合花","1梅花","1木绵花"],
				["4、这是什么花","2木绵花","2菊花","2百合花","2梅花","2木绵花"],
				["5、这是什么花","1木绵花","1菊花","1百合花","1梅花","1木绵花"],
				["6、这是什么花","2木绵花","2菊花","2百合花","2梅花","2木绵花"],
				["7、这是什么花","1木绵花","1菊花","1百合花","1梅花","1木绵花"],
				["8、这是什么花","2木绵花","2菊花","2百合花","2梅花","2木绵花"],
				["9、这是什么花","1木绵花","1菊花","1百合花","1梅花","1木绵花"],
				["10、这是什么花","2木绵花","2菊花","2百合花","2梅花","2木绵花"]
			 ]	 
	function init(i){
		$("#img").css("backgroundImage", "url(img/"+(i+1)+".jpg)");
		$("#lbl").text(item[i][0]);
		$("#A").text(item[i][1]);
		$("#B").text(item[i][2]);
		$("#C").text(item[i][3]);
		$("#D").text(item[i][4]);
	}
	function sel(i){ 
		var key=$("#"+i).text(); 
		if(item[curr][5]==key){
			$("#s"+(curr+1)).attr("src", "img/m.png");
			score++;
		}
		curr++;
		if(curr<item.length){
			init(curr);
		}else{
			$("#ms").text(score+"颗");
			showOverlay();
			curr=0;
			score=0;
		}
		
	}
	init(curr);
	
	
	
	
	/*------------------------遮罩----------------------------*/
	const overlay = document.getElementById('overlay');
	
	// 显示遮罩
	function showOverlay() {
	  overlay.classList.add('show');
	  // 禁止页面滚动
	  document.body.style.overflow = 'hidden';
	}
	
	// 隐藏遮罩
	function hideOverlay() {
	  overlay.classList.remove('show');
	  // 恢复页面滚动
	  document.body.style.overflow = '';
	  curr=0;
	  init(curr);
	  $("#score img").attr("src", "img/mf.png");
	}
	/*------------------------遮罩-end---------------------------*/
</script>
